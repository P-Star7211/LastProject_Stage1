<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Home</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

<style>

body{
    background:#f5fffb;
}

.sidebar{
    background:#198754;
    min-height:100vh;
}

.logo{
    color:white;
    font-weight:bold;
}

.menu-link{
    color:white;
    text-decoration:none;
    display:block;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    transition:.3s;
}

.menu-link:hover{
    background:#4ce3a7;
    color:#198754;
}

.post-card{
    border:none;
    border-radius:15px;
}

.post-btn{
    background:#198754;
    color:white;
}

.post-btn:hover{
    background:#4ce3a7;
}

.follow-card{
    border:none;
    border-radius:15px;
}

.follow-btn{
    background:#4ce3a7;
    border:none;
    color:#198754;
    font-weight:bold;
}

.profile-mini{
    width:45px;
    height:45px;
    border-radius:50%;
}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- SIDEBAR -->

<div class="col-md-3 sidebar p-4">

    <h2 class="logo">
        <i class='bx bxs-conversation'></i>
        MediaKu
    </h2>

    <hr class="text-white">

    <a href="home.html" class="menu-link">
        <i class='bx bx-home'></i>
        Home
    </a>

    <a href="#" class="menu-link">
        <i class='bx bx-search'></i>
        Search
    </a>

    <a href="profile.html" class="menu-link">
        <i class='bx bx-user'></i>
        Profile
    </a>

</div>

<!-- FEED -->

<div class="col-md-6 p-4">

    <div class="card post-card shadow">

        <div class="card-body">

            <h4>Apa Yang Ingin Kamu Sampaikan Hari Ini?</h4>

            <textarea
                class="form-control mb-3"
                id="postInput"
                rows="3"
                placeholder="Bagikan cerita Anda...">
            </textarea>

            <button
                class="btn post-btn w-100"
                onclick="createPost()">

                Posting

            </button>

        </div>

    </div>

    <div id="feedContainer" class="mt-4"></div>

</div>

<!-- FOLLOW -->

<div class="col-md-3 p-4">

    <div class="card follow-card shadow">

        <div class="card-body">

            <h5>Suggested Follows</h5>

            <hr>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <span>John Doe</span>

                <button class="btn follow-btn btn-sm">
                    Follow
                </button>

            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <span>Maria Clara</span>

                <button class="btn follow-btn btn-sm">
                    Follow
                </button>

            </div>

            <div class="d-flex justify-content-between align-items-center">

                <span>Alex Johnson</span>

                <button class="btn follow-btn btn-sm">
                    Follow
                </button>

            </div>

        </div>

    </div>

</div>

</div>

</div>

<script>

let posts =
JSON.parse(localStorage.getItem("posts")) || [];

renderPosts();

function createPost(){

    const input =
    document.getElementById("postInput");

    const content =
    input.value.trim();

    if(content === ""){

        alert("Postingan tidak boleh kosong!");

        return;
    }

    const post = {

        username:"Firmansyah",

        content:content,

        time:
        new Date().toLocaleString()

    };

    posts.unshift(post);

    localStorage.setItem(
        "posts",
        JSON.stringify(posts)
    );

    renderPosts();

    input.value = "";

}

function renderPosts(){

    const feed =
    document.getElementById("feedContainer");

    feed.innerHTML = "";

    posts.forEach(post=>{

        feed.innerHTML += `

        <div class="card shadow mb-3 border-0">

            <div class="card-body">

                <h6 class="text-success">
                    ${post.username}
                </h6>

                <small class="text-muted">
                    ${post.time}
                </small>

                <p class="mt-2">
                    ${post.content}
                </p>

            </div>

        </div>

        `;
    });
}

</script>

</body>
</html>
