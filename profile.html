<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        body {
            background: #f5fffb;
        }

        .cover {
            height: 250px;
            background:
                linear-gradient(135deg,
                    #198754,
                    #4ce3a7);
        }

        .profile-img {

            width: 170px;
            height: 170px;

            border-radius: 50%;

            border: 6px solid white;

            margin-top: -85px;

            object-fit: cover;
        }

        .follow-btn {

            background: #198754;
            color: white;
            border: none;
        }

        .follow-btn:hover {

            background: #4ce3a7;
            color: #198754;
        }

        .info-card {

            border: none;
            border-radius: 20px;
        }
    </style>

</head>

<body>

    <!-- COVER -->

    <div class="cover"></div>

    <div class="container">

        <div class="text-center">

            <img src="https://i.pravatar.cc/300" class="profile-img shadow">

            <h2 class="mt-3">

                Firmansyah Pratama Aji

            </h2>

            <p class="text-muted">

                Full Stack Developer Student

            </p>

            <button class="btn follow-btn">

                Edit Profile

            </button>

        </div>

        <div class="row mt-5">

            <div class="col-md-4">

                <div class="card info-card shadow">

                    <div class="card-body">

                        <h5>Tentang Saya</h5>

                        <hr>

                        <p>

                            Sedang belajar HTML,
                            CSS, Bootstrap,
                            JavaScript dan TypeScript.

                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-8">

                <div class="card info-card shadow">

                    <div class="card-body">

                        <h5>Aktivitas Terbaru</h5>

                        <hr>

                        <div class="mb-3">

                            <h6 class="text-success">

                                Membuat Dashboard Media Sosial

                            </h6>

                            <small class="text-muted">

                                2 jam yang lalu

                            </small>

                        </div>

                        <div>

                            <h6 class="text-success">

                                Belajar Local Storage

                            </h6>

                            <small class="text-muted">

                                Kemarin

                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="text-center mt-4 mb-5">

            <a href="home.html" class="btn btn-success">

                Kembali ke Home

            </a>

        </div>

    </div>

</body>

</html>
