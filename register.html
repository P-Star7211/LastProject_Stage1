<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrasi</title>

    <link rel="stylesheet" href="Form Register/style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        body {
            background: linear-gradient(135deg, #198754, #20c997);
            min-height: 100vh;
        }

        .register-card {
            border-radius: 20px;
        }

        .title {
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-md-6 col-lg-4">

                <div class="card register-card shadow-lg">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold text-success">
                                <i class='bx bxs-user-plus'></i> Daftarkan Dirimu
                            </h2>
                        </div>

                        <div class="btn-group w-100 mb-4">
                            <button class="btn btn-outline-success">
                                Login
                            </button>

                            <button class="btn btn-success">
                                Daftar
                            </button>
                        </div>

                        <form>

                            <div class="mb-3">
                                <label for="InputNama" class="form-label"><i class='bx bxs-user'></i>Nama
                                    Lengkap</label>
                                <input type="Nama" class="form-control" id="InputNama"
                                    placeholder="Masukkan Nama Lengkap">

                            </div>


                            <div class="mb-3">
                                <label for="InputEmail" class="form-label"><i class='bx bxs-envelope'></i>Email</label>
                                <input type="Email" class="form-control" id="InputEmail"
                                    placeholder="Masukkan Alamat email">

                            </div>

                            <div class="mb-3">
                                <label for="InputPassword" class="form-label"><i
                                        class='bx bxs-lock-alt'></i>Password</label>
                                <input type="password" class="form-control" id="InputPassword"
                                    placeholder="Masukkan Password">

                            </div>

                            <div class="mb-3">
                                <label for="UlangiPassword" class="form-label"><i class='bx bxs-lock-alt'></i>Ulangi
                                    Password</label>
                                <input type="password" class="form-control" id="UlangiPassword"
                                    placeholder="Ulangi Password">

                            </div>

                            <button type="submit" class="btn submit-btn w-100">
                                <a href="login.html" class="text-white fw-bold text-decoration-none">
                                    Kirimkan


                            </button>


                        </form>


                        <hr>

                        <a href="login.html" class="text-success fw-bold text-decoration-none">

                            Login di sini

                        </a>



                    </div>



                </div>


</body>

</html>
